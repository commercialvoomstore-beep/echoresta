# Vérification du site en ligne et envoi d'un formulaire de test (e-mail + base Neon).
# Se lance tout seul quand ce fichier change, ou à la main : GitHub → Actions → « Test du site et des formulaires » → Run workflow.
# Chaque lancement envoie UN e-mail « TEST » (avec son récapitulatif PDF et un document de test) à contact@voomnetformation.ci
# et ajoute une ligne dans les tables demandes et fichiers.
name: Test du site et des formulaires
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-formulaires.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.echoresta.ci
    steps:
      - name: Le site répond
        run: curl -fsS -o /dev/null -w 'accueil %{http_code}\n' "$SITE/"
      - name: Pages sans .html et redirection des anciennes adresses
        run: |
          curl -fsS -o /dev/null -w 'formations %{http_code}\n' "$SITE/formations"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE/formations.html"); echo "formations.html → $code"; test "$code" = 308 -o "$code" = 301
      - name: Version anglaise
        run: curl -fsS -o /dev/null -w 'en %{http_code}\n' "$SITE/en/"
      - name: Sitemap et robots.txt
        run: |
          curl -fsS "$SITE/sitemap.xml" | grep -c '<loc>https://www.echoresta.ci/' 
          curl -fsS "$SITE/robots.txt" | grep 'Sitemap: https://www.echoresta.ci/sitemap.xml'
      - name: Envoi d'un document de test (comme le CV d'un candidat)
        run: |
          printf '%%PDF-1.4\n%% Document de test EchoResta : verification de l envoi des CV. Vous pouvez l ignorer.\n%%%%EOF\n' > test.pdf
          curl -sS -o fichier.json -w 'HTTP %{http_code}\n' -X POST "$SITE/api/fichier" -H "Origin: $SITE" \
            -H 'Content-Type: application/octet-stream' -H 'X-Nom-Fichier: TEST-document.pdf' -H 'X-Champ: Document de test' \
            --data-binary @test.pdf
          cat fichier.json; echo
          jq -e '.ok == true and .type == "application/pdf"' fichier.json
      - name: Envoi du formulaire de test
        run: |
          jq -n --slurpfile f fichier.json '{
            sujet: "TEST – vérification des formulaires du site (à ignorer)", formulaire: "form-contact", langue: "fr", page: "/contact",
            consentement: "Test automatique (case de consentement)",
            champs: {"Nom": "Test automatique", "Téléphone": "+225 07 68 84 20 38", "Objet": "Demande d’information", "Formation": "Cuisinier",
                     "Message": "Message envoyé automatiquement pour vérifier que les formulaires du site et leurs documents arrivent dans cette boîte et dans la base Neon. Vous pouvez le supprimer."},
            sections: [["Vos coordonnées", ["Nom", "Téléphone"]], ["Votre demande", ["Objet", "Formation", "Message"]]],
            fichiers: [{id: $f[0].id, cle: $f[0].cle}]}' > fiche.json
          curl -sS -o reponse.json -w 'HTTP %{http_code}\n' -X POST "$SITE/api/envoyer" \
            -H 'Content-Type: application/json' -H "Origin: $SITE" --data-binary @fiche.json
          cat reponse.json; echo
          grep -q '"ok":true' reponse.json
      - name: Enregistrement dans la base Neon
        if: always()
        run: grep -q '"enregistre":true' reponse.json
      - name: Envoi de l'e-mail Microsoft 365
        if: always()
        run: grep -q '"envoye":true' reponse.json
      - name: Récapitulatif PDF joint à l'e-mail
        if: always()
        run: grep -q '"pdf":true' reponse.json
      - name: Document relié à la demande et téléchargeable par son lien
        if: always()
        run: |
          grep -q '"documents":1' reponse.json
          curl -fsS -o recu.pdf "$SITE/api/fichier?n=$(jq -r .id fichier.json)&k=$(jq -r .cle fichier.json)"
          cmp test.pdf recu.pdf && echo "document téléchargé identique"
